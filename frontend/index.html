<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        background: #f7f7f7;
        color: #222;
      }
      .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      button {
        cursor: pointer;
        margin-right: 0.5rem;
      }
      pre {
        white-space: pre-wrap;
        background: #222;
        color: #eee;
        padding: 1rem;
        border-radius: 6px;
      }
      a {
        color: #06c;
        text-decoration: none;
        cursor: pointer;
      }
      a:hover {
        text-decoration: underline;
      }
      input,
      select {
        padding: 0.3rem;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
